# GNOME-only modules. Included from recipes/gnome.yml after common.yml.

modules:
  # GNOME-only packages.
  #
  # adw-gtk3 styles legacy GTK3 apps to match libadwaita. Bluefin shipped this
  # by default; silverblue-main does not, so it has to be added explicitly.
  # Pointless on KDE, hence here rather than common.yml.
  #
  # If the build fails on the name, run `dnf search adw-gtk3` to confirm it.
  - type: dnf
    install:
      packages:
        - gnome-tweaks
        # adw-gtk3-theme is NOT listed: silverblue-main already ships it, and
        # dnf5 treats an already-installed package as a resolution FAILURE
        # rather than a no-op ("Package ... is already installed").
        #
        # Flatpak IDs do not go here either -- they belong in the
        # default-flatpaks block at the bottom of this file.

  # dconf databases: desktop defaults, extension allowlist, GDM branding
  - type: files
    files:
      - source: gnome
        destination: /

  # Installs system-wide from extensions.gnome.org, matching this image's
  # GNOME release. Names are the human-readable ones from the site.
  #
  # Check `gnome-extensions list` in the VM first -- if Bluefin already ships
  # these as RPMs, drop them here and rely on 02-extensions alone.
  - type: gnome-extensions
    install:
      - Dash to Dock
      - Blur my Shell

  # Must run after the dconf files land.
  - type: script
    scripts:
      - dconf-update.sh

  # ---------------------------------------------------------------
  # Flatpaks (GNOME additions)
  # ---------------------------------------------------------------
  # APPENDS to the configuration list from common.yml -- it does not replace
  # it. Both configurations run on GNOME; KDE gets only common.yml's.
  #
  # GTK3 theme for sandboxed apps. Flatpaks cannot see host themes, so the
  # theme must exist inside the runtime too. xdg-desktop-portal passes the
  # host's gtk-theme setting through automatically.
  #
  # If the build fails validating these IDs, v2 checks Flathub availability at
  # build time and may not handle runtime extensions. Fall back to the v1
  # layout in that case.
  - type: default-flatpaks@v2
    configurations:
      - scope: system
        install:
          # GUI for managing GNOME extensions. Meaningless on Plasma.
          - com.mattjakeman.ExtensionManager

          - org.gtk.Gtk3theme.adw-gtk3
          - org.gtk.Gtk3theme.adw-gtk3-dark