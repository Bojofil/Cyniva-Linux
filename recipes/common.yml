# Shared modules for both the GNOME and KDE images.
# Included from recipes/gnome.yml and recipes/kde.yml via `from-file`.
#
# default-flatpaks is @v2 here: v2 takes a list of `configurations:` and
# subsequent module calls APPEND to that list rather than overriding. That
# lets the shared app list live here while gnome.d.yml adds a GNOME-only
# configuration for the GTK3 theme extensions.

modules:
  # ---------------------------------------------------------------
  # Static files (repo definitions, logos, helper scripts)
  # ---------------------------------------------------------------
  # MUST come before dnf: this is what puts vscode.repo and megasync.repo
  # into /etc/yum.repos.d. Without it the resolver has never heard of those
  # repos and fails with "Packages not found: code, megasync".
  - type: files
    files:
      - source: system
        destination: /

  # Import third-party repo GPG keys before installing from those repos.
  - type: script
    scripts:
      - repo-keys.sh

  # ---------------------------------------------------------------
  # Layered RPMs
  # ---------------------------------------------------------------
  # Uses the `dnf` module, NOT `rpm-ostree`. Fedora replaced rpm-ostree with
  # dnf5 + bootc from F41 onward, and the Kinoite/Aurora bases no longer
  # support rpm-ostree in container builds -- it fails with "This system was
  # not booted via libostree".
  - type: dnf
    install:
      packages:
        # --- apps ---
        - firefox
        - code                 # needs the Microsoft repo, see files/system/etc/yum.repos.d/
        - papirus-icon-theme
        # megasync is NOT here -- its %post scriptlet breaks the whole
        # transaction. Installed separately by install-megasync.sh below.

        # --- Active Directory plumbing ---
        # The join itself CANNOT be baked in (per-machine keytab), but every
        # tool needed to perform it at first boot can be.
        - realmd
        - sssd
        - sssd-tools
        - adcli
        - oddjob
        - oddjob-mkhomedir
        - samba-common-tools
        - krb5-workstation

  # ---------------------------------------------------------------
  # Flatpaks (shared)
  # ---------------------------------------------------------------
  # gnome.d.yml appends a second configuration for the adw-gtk3 theme
  # extensions. v2 appends rather than overrides, so both apply on GNOME
  # while KDE gets only this one.
  #
  # NOTE: v2 dropped `remove:`. The old `remove: org.mozilla.firefox` line is
  # gone. That was there to kill Bluefin's bundled Firefox Flatpak; on
  # silverblue-main Firefox comes from the RPM and there is nothing to remove.
  # Verify with: flatpak list --app | grep -i firefox
  - type: default-flatpaks@v2
    configurations:
      - scope: system
        notify: true
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: Flathub
        install:
          - eu.betterbird.Betterbird
          - com.bitwarden.desktop
          - com.spotify.Client
          - com.discordapp.Discord
          - io.github.pol_rivero.github-desktop-plus
          - com.adamcake.Bolt

  # ---------------------------------------------------------------
  # Fonts
  # ---------------------------------------------------------------
  # Adwaita Mono Nerd Font was added upstream in Nerd Fonts 3.4.0.
  # If the build 404s, check the exact asset name on the Nerd Fonts
  # releases page -- casing matters ("AdwaitaMono" vs "Adwaita-Mono").
  - type: fonts
    fonts:
      nerd-fonts:
        - AdwaitaMono

  # ---------------------------------------------------------------
  # Build-time scripts
  # ---------------------------------------------------------------
  - type: script
    scripts:
      - install-megasync.sh
      - branding.sh
      - plymouth.sh
      - authselect.sh
      - fix-perms.sh

  # ---------------------------------------------------------------
  # Regenerate initramfs
  # ---------------------------------------------------------------
  # REQUIRED for the plymouth theme to take effect. Plymouth starts before
  # the root filesystem is mounted, so the theme must live inside the
  # initramfs -- editing /usr/share/plymouth alone changes nothing.
  #
  # This adds noticeably to build time and image size. If you drop
  # plymouth.sh, drop this too.
  - type: initramfs
