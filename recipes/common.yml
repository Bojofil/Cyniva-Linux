# Shared modules for both the GNOME and KDE images.
# Included from recipes/gnome.yml and (later) recipes/kde.yml via `from-file`.

modules:
  # ---------------------------------------------------------------
  # Static files (repo definitions, dconf defaults, helper scripts)
  # ---------------------------------------------------------------
  # MUST come before rpm-ostree: this is what puts vscode.repo and
  # megasync.repo into /etc/yum.repos.d. Without it the resolver has never
  # heard of those repos and fails with "Packages not found: code, megasync".
  - type: files
    files:
      - source: system
        destination: /

  # Import third-party repo GPG keys before installing from those repos.
  - type: script
    scripts:
      - repo-keys.sh

  # ---------------------------------------------------------------
  # Layered RPMs
  # ---------------------------------------------------------------
  # Uses the `dnf` module, NOT `rpm-ostree`. Fedora replaced rpm-ostree with
  # dnf5 + bootc from F41 onward, and Aurora's base no longer supports
  # rpm-ostree in container builds -- it fails with "This system was not
  # booted via libostree". The dnf module works on both bases.
  #
  # Note the nested schema: packages go under `install: packages:`, not
  # directly under `install:` like the old module.
  - type: dnf
    install:
      packages:
        # --- your apps ---
        - firefox
        - code                       # needs the Microsoft repo, see files/system/etc/yum.repos.d/
        - papirus-icon-theme
        # megasync is NOT here -- its %post scriptlet breaks the whole
        # transaction. Installed separately by install-megasync.sh below.

        # --- Active Directory plumbing ---
        # The join itself CANNOT be baked in (per-machine keytab), but every
        # tool needed to perform it at first boot can be.
        - realmd
        - sssd
        - sssd-tools
        - adcli
        - oddjob
        - oddjob-mkhomedir
        - samba-common-tools
        - krb5-workstation

  # ---------------------------------------------------------------
  # Flatpaks
  # ---------------------------------------------------------------
  # Flatpaks are NOT baked into the image. This module drops in a systemd
  # unit that installs them on first boot, then marks itself done.
  # Pinned to v1: the module was rewritten with a breaking config change.
  # See https://blue-build.org/reference/modules/default-flatpaks/ if you
  # want to migrate this block to the v2 schema later.
  - type: default-flatpaks@v1
    notify: true
    system:
      repo-url: https://dl.flathub.org/repo/flathub.flatpakrepo
      repo-name: flathub
      repo-title: "Flathub"
      install:
        - eu.betterbird.Betterbird
        - com.bitwarden.desktop
        - com.spotify.Client
        - com.discordapp.Discord
        - io.github.pol_rivero.github-desktop-plus
        - com.adamcake.Bolt

      remove:
        # We layer the Firefox RPM instead, so drop Bluefin's bundled Flatpak.
        # Without this you get two Firefoxes with separate profiles.
        # If you ever switch to the Flatpak, move org.mozilla.firefox up to
        # `install:` and drop `firefox` from the rpm-ostree list above.
        - org.mozilla.firefox

  # ---------------------------------------------------------------
  # Fonts
  # ---------------------------------------------------------------
  # Adwaita Mono Nerd Font was added upstream in Nerd Fonts 3.4.0.
  # If the build 404s, check the exact asset name on the Nerd Fonts
  # releases page -- casing matters ("AdwaitaMono" vs "Adwaita-Mono").
  - type: fonts
    fonts:
      nerd-fonts:
        - AdwaitaMono

  # ---------------------------------------------------------------
  # Build-time scripts
  # ---------------------------------------------------------------
  - type: script
    scripts:
      - install-megasync.sh
      - branding.sh
      - plymouth.sh
      - authselect.sh
      - fix-perms.sh

  # ---------------------------------------------------------------
  # Regenerate initramfs
  # ---------------------------------------------------------------
  # REQUIRED for the plymouth theme to take effect. Plymouth starts before
  # the root filesystem is mounted, so the theme must live inside the
  # initramfs -- editing /usr/share/plymouth alone changes nothing.
  #
  # This adds noticeably to build time and image size. If you drop
  # plymouth.sh, drop this too.
  - type: initramfs
